    <!-- Preconnect for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="dns-prefetch" href="https://i.imgur.com" />
    <link rel="dns-prefetch" href="https://i.pinimg.com" />

    <!-- Dynamic Open Graph injection -->
    <script>
      (function() {
        /* __OG_ARTICLES__ */

        var path = window.location.pathname;
        var match = path.match(/\/blog\/([^\/]+)/);
        var article = match ? ARTICLES[match[1]] : null;

        function setMeta(prop, val, useProperty) {
          if (!val) return;
          var attr = useProperty ? 'property' : 'name';
          var el = document.querySelector('meta[' + attr + '="' + prop + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, prop);
            document.head.appendChild(el);
          }
          el.setAttribute('content', val);
        }

        if (article) {
          var base = 'https://www.getsecondpassport.eu';
          var url  = base + path;
          var t    = article.title + ' | Dera Consultants';

          setMeta('og:type',         'article',            true);
          setMeta('og:url',          url,                  true);
          setMeta('og:title',        t,                    true);
          setMeta('og:description',  article.description,  true);
          setMeta('og:image',        article.image,        true);
          setMeta('og:image:width',  '1200',               true);
          setMeta('og:image:height', '630',                true);
          setMeta('og:site_name',    'Dera Consultants',   true);

          setMeta('twitter:card',        'summary_large_image', true);
          setMeta('twitter:url',         url,                   true);
          setMeta('twitter:title',       t,                     true);
          setMeta('twitter:description', article.description,   true);
          setMeta('twitter:image',       article.image,         true);

          var desc = document.querySelector('meta[name="description"]');
          if (desc) desc.setAttribute('content', article.description);

          var can = document.querySelector('link[rel="canonical"]');
          if (can) can.setAttribute('href', url);

          document.title = t;
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Dera Consultants | Portugal Residency &amp; Caribbean Citizenship Advisory</title>
